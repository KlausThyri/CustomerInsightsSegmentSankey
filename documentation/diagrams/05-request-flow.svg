<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#605E5C"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="58" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#242424">Request Flow – From the Browser to Fabric and Back</text><text x="60" y="92" font-family="Segoe UI, Arial" font-size="18" fill="#605E5C">The Custom API is the Dataverse endpoint; the plugin holds the logic and calls the Azure Web App</text><path d="M 290 320 L 350 320" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><path d="M 600 320 L 660 320" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><path d="M 910 320 L 970 320" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1220 320 L 1280 320" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1405 405 L 1100 610" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><rect x="1160.5" y="477.5" width="184" height="28" rx="6" fill="#FFFFFF" opacity="0.92"/><text x="1252.5" y="497.5" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#242424">Result</text><path d="M 350 665 L 165 405" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><rect x="165.5" y="505" width="184" height="28" rx="6" fill="#FFFFFF" opacity="0.92"/><text x="257.5" y="525" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#242424">back to the UI</text><rect x="40" y="235" width="250" height="170" rx="16" fill="#F3F2F1" stroke="#1E1E1E" stroke-width="3"/><text x="165" y="306" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">1  Web Resource</text><text x="165" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">Browser</text><text x="165" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">calls the Dataverse Web API</text><rect x="350" y="235" width="250" height="170" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/><text x="475" y="306" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">2  Dataverse Custom API</text><text x="475" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">registered endpoint</text><text x="475" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">parameters + plugin mapping</text><rect x="660" y="235" width="250" height="170" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/><text x="785" y="306" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">3  Dataverse Plugin</text><text x="785" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">C# IPlugin</text><text x="785" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">reads MQL and metadata</text><rect x="970" y="235" width="250" height="170" rx="16" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/><text x="1095" y="306" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">4  Azure Web App</text><text x="1095" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">ASP.NET Core REST API</text><text x="1095" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">compiles and orchestrates</text><rect x="1280" y="235" width="250" height="170" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/><text x="1405" y="306" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">5  Microsoft Fabric</text><text x="1405" y="326" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">Lakehouse + SQL Endpoint</text><text x="1405" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">evaluates sets</text><rect x="350" y="610" width="870" height="105" rx="16" fill="#FFF4CE" stroke="#F7630C" stroke-width="3"/><text x="785" y="648.5" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">6  Response Path</text><text x="785" y="668.5" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">Fabric → Azure API → Plugin → Custom API → Web Resource</text><text x="785" y="688.5" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">Counts, or securely paginated contacts hydrated in Dataverse</text></svg>