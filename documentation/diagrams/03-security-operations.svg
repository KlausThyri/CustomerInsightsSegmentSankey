<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#605E5C"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="58" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#242424">Security, Trust Boundaries, and Operations</text><text x="60" y="92" font-family="Segoe UI, Arial" font-size="18" fill="#605E5C">Identities, tokens, personal data, and critical operational dependencies</text><rect x="40" y="130" width="470" height="650" rx="18" fill="none" stroke="#0078D4" stroke-width="3" stroke-dasharray="10 7"/><text x="58" y="160" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#242424">User/Browser Trust Boundary</text><rect x="550" y="130" width="450" height="650" rx="18" fill="none" stroke="#5C2D91" stroke-width="3" stroke-dasharray="10 7"/><text x="568" y="160" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#242424">Server-side Azure Trust Boundary</text><rect x="1040" y="130" width="510" height="650" rx="18" fill="none" stroke="#107C10" stroke-width="3" stroke-dasharray="10 7"/><text x="1058" y="160" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#242424">Fabric/Data Trust Boundary</text><path d="M 275 290 L 275 370" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><rect x="183" y="300" width="184" height="28" rx="6" fill="#FFFFFF" opacity="0.92"/><text x="275" y="320" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#242424">authenticated session</text><path d="M 470 430 L 590 245" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><rect x="438" y="307.5" width="184" height="28" rx="6" fill="#FFFFFF" opacity="0.92"/><text x="530" y="327.5" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" f