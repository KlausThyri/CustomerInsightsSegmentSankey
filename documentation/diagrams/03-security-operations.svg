 font-size="17" font-weight="400" fill="#000000">Access to Fabric SQL</text><text x="1295" y="271" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">and Fabric REST</text><rect x="1080" y="390" width="430" height="120" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/><text x="1295" y="436" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">Serving Lakehouse</text><text x="1295" y="456" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">Fabric processes sets</text><text x="1295" y="476" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">returns counts or IDs</text><rect x="1080" y="610" width="430" height="110" rx="16" fill="#FFF4CE" stroke="#F7630C" stroke-width="3"/><text x="1295" y="651" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">Operationally Critical</text><text x="1295" y="671" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">F2 Capacity must be Active</text><text x="1295" y="691" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">Monitor bootstrap + data freshness</text></svg>