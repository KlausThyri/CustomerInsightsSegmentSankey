)"/><rect x="928" y="527.5" width="184" height="28" rx="6" fill="#FFFFFF" opacity="0.92"/><text x="1020" y="547.5" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#242424">Counts / max. 50 IDs</text><path d="M 590 665 L 470 645" fill="none" stroke="#605E5C" stroke-width="3" marker-end="url(#arrow)"/><rect x="438" y="625" width="184" height="28" rx="6" fill="#FFFFFF" opacity="0.92"/><text x="530" y="645" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#242424">visible fields</text><rect x="80" y="190" width="390" height="100" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/><text x="275" y="236" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">Dynamics User</text><text x="275" y="256" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">Dataverse sign-in and roles</text><rect x="80" y="370" width="390" height="120" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/><text x="275" y="416" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">Browser Context</text><text x="275" y="436" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">Evaluation token kept in memory only</text><text x="275" y="456" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">no token in the URL</text><rect x="80" y="590" width="390" height="110" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/><text x="275" y="631" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#000000">Members Dialog</text><text x="275" y="651" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="#000000">max. 50 visible records</text><text x="275" y="671" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="400" fill="