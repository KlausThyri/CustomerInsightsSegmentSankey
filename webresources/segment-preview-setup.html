<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Segment Preview Setup</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
    }
    button { font: inherit; }
    button:focus-visible, summary:focus-visible {
      outline: 2px solid var(--cp-accent);
      outline-offset: 2px;
    }
    .page {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 36px 0 64px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 28px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--cp-accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 650;
      letter-spacing: -.03em;
    }
    .intro {
      max-width: 720px;
      margin: 12px 0 0;
      color: var(--cp-text-muted);
      font-size: 16px;
      line-height: 1.55;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .button {
      min-height: 40px;
      border: 1px solid var(--cp-border-strong);
      border-radius: .625rem;
      padding: 8px 16px;
      background: var(--cp-surface);
      color: var(--cp-text);
      cursor: pointer;
      font-weight: 600;
    }
    .button:hover:not(:disabled) { background: var(--cp-surface-soft); }
    .button.primary {
      border-color: var(--cp-accent);
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
    }
    .button.primary:hover:not(:disabled) { background: var(--cp-accent-hover); }
    .button:disabled { cursor: wait; opacity: .6; }
    .summary {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      padding: 20px;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .summary-icon, .status-icon {
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--cp-surface-soft);
      color: var(--cp-text-muted);
      flex: 0 0 auto;
    }
    .summary-icon { width: 48px; height: 48px; }
    .status-icon { width: 34px; height: 34px; }
    .state-ready .summary-icon, .state-ready .status-icon { color: var(--cp-success); }
    .state-partial .summary-icon, .state-partial .status-icon,
    .state-notConfigured .status-icon, .state-blocked .status-icon { color: var(--cp-warning); }
    .state-unavailable .summary-icon, .state-unavailable .status-icon { color: var(--cp-danger); }
    .summary-title { margin: 0; font-size: 18px; font-weight: 650; }
    .summary-copy { margin: 4px 0 0; color: var(--cp-text-muted); }
    .summary-meta { color: var(--cp-text-soft); font-size: 12px; text-align: right; }
    .notice {
      margin-bottom: 20px;
      border: 1px solid var(--cp-border);
      border-left: 4px solid var(--cp-accent);
      border-radius: .625rem;
      padding: 12px 16px;
      background: var(--cp-surface);
      line-height: 1.45;
    }
    .notice.error { border-left-color: var(--cp-danger); }
    .notice.success { border-left-color: var(--cp-success); }
    .groups { display: grid; gap: 28px; }
    .group-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 0 12px;
    }
    .group-title h2 { margin: 0; font-size: 18px; }
    .group-title span { color: var(--cp-text-soft); font-size: 12px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }
    .card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 132px;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      padding: 18px;
      background: var(--cp-surface);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .card-main { min-width: 0; flex: 1; }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .card h3 { margin: 0; font-size: 15px; }
    .badge {
      border: 1px solid var(--cp-border);
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--cp-surface-soft);
      color: var(--cp-text-muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .state-ready .badge { color: var(--cp-success); }
    .state-partial .badge, .state-notConfigured .badge, .state-blocked .badge {
      color: var(--cp-warning);
    }
    .state-unavailable .badge { color: var(--cp-danger); }
    .message { margin: 9px 0 0; color: var(--cp-text-muted); line-height: 1.45; }
    details { margin-top: 10px; color: var(--cp-text-soft); }
    summary { cursor: pointer; color: var(--cp-link); }
    .detail {
      overflow-wrap: anywhere;
      margin: 8px 0 0;
      font-family: Consolas, "Courier New", Courier, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
    .card-action {
      margin-top: 12px;
      border: 0;
      padding: 0;
      background: none;
      color: var(--cp-link);
      cursor: pointer;
      font-weight: 600;
    }
    .card-action:hover { text-decoration: underline; }
    .empty {
      padding: 48px 20px;
      border: 1px dashed var(--cp-border-strong);
      border-radius: 16px;
      color: var(--cp-text-muted);
      text-align: center;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid var(--cp-border);
      border-top-color: var(--cp-accent);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 720px) {
      .page { width: min(100% - 24px, 1180px); padding-top: 24px; }
      .hero { flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .summary { grid-template-columns: auto 1fr; }
      .summary-meta { grid-column: 2; text-align: left; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">Customer Insights – Journeys</p>
        <h1>Segment Preview</h1>
        <p class="intro">
          Check the installation, configure environment-specific dependencies, and
          provision missing Fabric components.
        </p>
      </div>
      <div class="toolbar">
        <button class="button" id="refreshButton" type="button">Refresh status</button>
        <button class="button primary" id="installButton" type="button">Install missing components</button>
      </div>
    </header>

    <section class="summary state-partial" id="summary" aria-live="polite">
      <div class="summary-icon" id="summaryIcon" aria-hidden="true"></div>
      <div>
        <p class="summary-title" id="summaryTitle">Checking installation…</p>
        <p class="summary-copy" id="summaryCopy">This may take a few seconds.</p>
      </div>
      <div class="summary-meta" id="summaryMeta"></div>
    </section>

    <div class="notice" id="notice" role="status" hidden></div>
    <div class="groups" id="groups">
      <div class="empty"><span class="spinner" aria-hidden="true"></span></div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const ACTION_NAME = "klth_ManageSegmentPreviewSetup";
      const stateLabels = {
        ready: "Installed",
        partial: "Incomplete",
        notConfigured: "Not configured",
        unavailable: "Unavailable",
        blocked: "Blocked"
      };
      const actionLabels = {
        "provision-shortcuts": "Install missing shortcuts",
        "configure-dataverse": "View configuration guidance",
        "configure-azure": "View Azure guidance",
        "configure-permissions": "View permission guidance",
        "run-fabric-bootstrap": "View Fabric guidance"
      };
      const guidance = {
        "configure-dataverse":
          "Set klth_FabricBehavioralApiUrl to the HTTPS API base URL ending in /api/ and configure klth_FabricBehavioralApiKey with the matching server-side key.",
        "configure-azure":
          "Deploy the Azure package, enable the system-assigned Managed Identity, and configure every required App Service setting.",
        "configure-permissions":
          "Grant the Web App Managed Identity access to the Fabric workspace and permission to use the configured Dataverse cloud connection.",
        "run-fabric-bootstrap":
          "Run the supplied Fabric bootstrap notebook against the Serving Lakehouse, then refresh this status page."
      };
      const icons = {
        check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        warning: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v4m0 3h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
        error: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="m9 9 6 6m0-6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
      };
      const state = { loading: false, result: null };

      const groupsHost = document.getElementById("groups");
      const summary = document.getElementById("summary");
      const summaryIcon = document.getElementById("summaryIcon");
      const summaryTitle = document.getElementById("summaryTitle");
      const summaryCopy = document.getElementById("summaryCopy");
      const summaryMeta = document.getElementById("summaryMeta");
      const notice = document.getElementById("notice");
      const refreshButton = document.getElementById("refreshButton");
      const installButton = document.getElementById("installButton");

      function getXrm() {
        try {
          return window.parent?.Xrm || window.top?.Xrm || null;
        } catch {
          return null;
        }
      }

      async function execute(action) {
        const xrm = getXrm();
        if (!xrm) {
          throw new Error("This setup page must be opened inside Dynamics 365.");
        }
        const clientUrl = xrm.Utility.getGlobalContext().getClientUrl();
        const response = await fetch(
          clientUrl + "/api/data/v9.2/" + ACTION_NAME,
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json; charset=utf-8",
              "OData-MaxVersion": "4.0",
              "OData-Version": "4.0"
            },
            body: JSON.stringify({ klth_action: action })
          }
        );
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(
            body?.error?.message || "The setup status could not be loaded."
          );
        }
        if (!body.klth_resultjson) {
          throw new Error("The setup API returned no result.");
        }
        return JSON.parse(body.klth_resultjson);
      }

      function setBusy(value) {
        state.loading = value;
        refreshButton.disabled = value;
        const canProvision = state.result?.components?.some(
          item => item.action === "provision-shortcuts"
        );
        installButton.disabled = value || !canProvision;
        document.body.setAttribute("aria-busy", value ? "true" : "false");
      }

      function showNotice(message, kind) {
        notice.textContent = message;
        notice.className = "notice" + (kind ? " " + kind : "");
        notice.hidden = !message;
      }

      function iconFor(componentState) {
        if (componentState === "ready") return icons.check;
        if (componentState === "unavailable") return icons.error;
        return icons.warning;
      }

      function render(result) {
        state.result = result;
        const components = Array.isArray(result.components) ? result.components : [];
        const overallState = result.overallState || "unavailable";
        summary.className = "summary state-" + overallState;
        summaryIcon.innerHTML = iconFor(overallState);
        summaryTitle.textContent =
          overallState === "ready"
            ? "Segment Preview is ready"
            : overallState === "unavailable"
            ? "Installation requires attention"
            : "Installation is incomplete";
        const readyCount = components.filter(item => item.state === "ready").length;
        summaryCopy.textContent =
          readyCount + " of " + components.length + " components are ready.";
        summaryMeta.textContent = [
          result.apiVersion ? "API " + result.apiVersion : "",
          result.checkedAt
            ? new Date(result.checkedAt).toLocaleString()
            : ""
        ].filter(Boolean).join(" · ");

        const actionable = components.some(
          item => item.action === "provision-shortcuts"
        );
        installButton.disabled = state.loading || !actionable;
        installButton.textContent = actionable
          ? "Install missing components"
          : overallState === "ready"
          ? "Installation complete"
          : "No automatic actions available";

        const byCategory = new Map();
        for (const component of components) {
          const category = component.category || "Other";
          if (!byCategory.has(category)) byCategory.set(category, []);
          byCategory.get(category).push(component);
        }
        groupsHost.replaceChildren();
        if (!components.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No component status was returned.";
          groupsHost.append(empty);
          return;
        }
        for (const [category, items] of byCategory) {
          const section = document.createElement("section");
          const title = document.createElement("div");
          title.className = "group-title";
          const heading = document.createElement("h2");
          heading.textContent = category;
          const count = document.createElement("span");
          count.textContent =
            items.filter(item => item.state === "ready").length +
            " / " + items.length + " ready";
          title.append(heading, count);
          const cards = document.createElement("div");
          cards.className = "cards";
          for (const component of items) {
            cards.append(createCard(component));
          }
          section.append(title, cards);
          groupsHost.append(section);
        }
      }

      function createCard(component) {
        const card = document.createElement("article");
        card.className = "card state-" + (component.state || "unavailable");
        const icon = document.createElement("div");
        icon.className = "status-icon";
        icon.innerHTML = iconFor(component.state);
        const main = document.createElement("div");
        main.className = "card-main";
        const header = document.createElement("div");
        header.className = "card-header";
        const name = document.createElement("h3");
        name.textContent = component.name;
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = stateLabels[component.state] || component.state;
        header.append(name, badge);
        const message = document.createElement("p");
        message.className = "message";
        message.textContent = component.message;
        main.append(header, message);
        if (component.detail) {
          const details = document.createElement("details");
          const label = document.createElement("summary");
          label.textContent = "Technical details";
          const detail = document.createElement("p");
          detail.className = "detail";
          detail.textContent = component.detail;
          details.append(label, detail);
          main.append(details);
        }
        if (component.action) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "card-action";
          button.textContent = actionLabels[component.action] || "Resolve";
          button.addEventListener("click", () => handleAction(component.action));
          main.append(button);
        }
        card.append(icon, main);
        return card;
      }

      async function refresh() {
        if (state.loading) return;
        setBusy(true);
        showNotice("");
        try {
          render(await execute("status"));
        } catch (error) {
          showNotice(error.message || String(error), "error");
          summary.className = "summary state-unavailable";
          summaryIcon.innerHTML = icons.error;
          summaryTitle.textContent = "Status check failed";
          summaryCopy.textContent =
            "Verify that the managed solution and setup Custom API are installed.";
          groupsHost.innerHTML =
            '<div class="empty">The component status is currently unavailable.</div>';
        } finally {
          setBusy(false);
        }
      }

      async function provision() {
        if (state.loading) return;
        setBusy(true);
        showNotice("Installing missing Fabric shortcuts…");
        try {
          const result = await execute("provision-shortcuts");
          render(result);
          showNotice("Missing Fabric shortcuts were installed successfully.", "success");
        } catch (error) {
          showNotice(error.message || String(error), "error");
        } finally {
          setBusy(false);
        }
      }

      function handleAction(action) {
        if (action === "provision-shortcuts") {
          provision();
          return;
        }
        showNotice(guidance[action] || "This component requires manual configuration.");
      }

      refreshButton.addEventListener("click", refresh);
      installButton.addEventListener("click", provision);
      refresh();
    })();
  </script>
</body>
</html>
